name: temple_lights_toggle
description: "Temple Lights — BLE Auto-Connect and LED Strip Control Companion App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # BLE transport
  flutter_reactive_ble: ^5.3.1

  # Permissions & platform
  permission_handler: ^12.0.1
  shared_preferences: ^2.3.2
  haptic_feedback: ^0.5.1

  # UI, Fonts & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  collection: ^1.19.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/firmware/
